<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop - Acasă</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Asigură afișarea corectă a grilei de carduri */
        .bouquets-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }
        .bouquet-card {
            width: 220px;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .bouquet-card:hover {
            transform: translateY(-5px);
        }
        .bouquet-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        /* Stil pentru imagine */
        .bouquet-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="content container">

    <div class="bouquets-section">

        <div th:if="${#lists.isEmpty(listaBuchete)}" style="text-align: center; width: 100%; margin-top: 20px;">
            <p>Momentan nu există buchete disponibile.</p>
        </div>

        <div class="bouquets-container">

            <div th:each="buchet : ${listaBuchete}" class="bouquet-card">

                <a th:href="@{/buchete/detalii/{id}(id=${buchet.id})}" class="bouquet-link">

                    <img th:src="${buchet.imageUrl != null && !#strings.isEmpty(buchet.imageUrl)} ? ${buchet.imageUrl} : @{/icons/logo.png}"
                         th:alt="${buchet.denumireBuchet}"
                         class="bouquet-img">

                    <div style="padding: 15px; text-align: center;">
                        <h4 th:text="${buchet.denumireBuchet}" style="margin: 0 0 10px 0; color: #333;">Nume</h4>
                        <p class="bouquet-price" th:text="${buchet.pret} + ' lei'" style="font-weight:bold; color: #800020; font-size: 18px; margin: 0;">0 lei</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div class="add-bouquet-wrap" style="text-align: center; margin: 40px 0;">
        <a th:href="@{/buchete/new}" class="add-bouquet-button" style="background-color: #800020; color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: bold;">Adaugă Buchet</a>
    </div>
</div>

<footer>
    <div class="footer-content">
        <h1>Contactează-ne</h1>
        <p>Adresa: Str. Tineretului 10, Chișinău, Moldova</p>
        <p>Telefon: +373 22 123 456</p>
        <p>Email: GrowFlowers@gmail.com</p>
        <div class="social-icons" style="margin-top: 15px;">
            <a href="#" style="margin: 0 5px;"><img th:src="@{/icons/facebook.png}" alt="Facebook" style="height: 30px;"></a>
            <a href="#" style="margin: 0 5px;"><img th:src="@{/icons/twiter.png}" alt="Twitter" style="height: 30px;"></a>
            <a href="#" style="margin: 0 5px;"><img th:src="@{/icons/insta.png}" alt="Instagram" style="height: 30px;"></a>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>

</body>
</html>
