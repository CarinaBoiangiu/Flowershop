<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${buchet.id} != null ? 'Editează Buchet' : 'Adaugă Buchet'">Formular Buchet</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-wrap { max-width: 700px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display:block; margin-bottom:6px; font-weight:600; }
        input[type=text], input[type=number], textarea { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; }
        .actions { display:flex; gap:10px; margin-top:15px; }
        .btn { background: var(--color-secondary, #800020); color:#fff; padding:10px 18px; border:none; border-radius:6px; cursor:pointer; }
        .btn.secondary { background:#6c757d; }
    </style>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div class="content">
    <div class="form-wrap">
        <h2 th:text="${buchet.id} != null ? 'Editează Buchet' : 'Adaugă Buchet'"></h2>
        <form th:action="@{/buchete}" th:object="${buchet}" method="post">
            <input type="hidden" th:if="*{id} != null" th:field="*{id}" />

            <div class="form-group">
                <label for="denumireBuchet">Denumire</label>
                <input type="text" id="denumireBuchet" th:field="*{denumireBuchet}" required>
            </div>

            <div class="form-group">
                <label for="descriere">Descriere</label>
                <textarea id="descriere" th:field="*{descriere}" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="pret">Preț (lei)</label>
                <input type="number" id="pret" th:field="*{pret}" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="imageUrl">URL imagine (opțional)</label>
                <input type="text" id="imageUrl" th:field="*{imageUrl}" placeholder="Ex: https://... sau /images/trandafiri.jpg">
                <small style="color:#666;">Poți lipi un link complet (https://) sau o cale din static (ex: /images/nume.jpg). </small>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Salvează</button>
                <a th:href="@{/buchete}" class="btn secondary">Renunță</a>
            </div>
        </form>
    </div>
</div>

<footer>
    <div class="footer-content">
        <h1>Contactează-ne</h1>
        <p>Adresa: Str. Tineretului 10, Chișinău, Moldova</p>
        <p>Telefon: +373 22 123 456</p>
        <p>Email: GrowFlowers@gmail.com</p>
        <div class="social-icons">
            <a href="#"><img th:src="@{/icons/facebook.png}" alt="Facebook"></a>
            <a href="#"><img th:src="@{/icons/twiter.png}" alt="Twitter"></a>
            <a href="#"><img th:src="@{/icons/insta.png}" alt="Instagram"></a>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
