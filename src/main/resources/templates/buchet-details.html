<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${buchet.denumireBuchet}">Detalii</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .product-container { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; background: white; border-radius: 15px; margin-top: 20px; justify-content: center; }
        .product-image img { max-width: 400px; width: 100%; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .product-info { max-width: 500px; }
    </style>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<div class="content container">
    <div class="product-container" th:object="${buchet}">
        <div class="product-image">
            <img th:src="*{imageUrl != null && !imageUrl.isEmpty()} ? *{imageUrl} : @{/icons/logo.png}"
                 th:alt="*{denumireBuchet}">
        </div>

        <div class="product-info">
            <h1 th:text="*{denumireBuchet}" style="color:#800020; margin-bottom:15px;"></h1>
            <p th:text="*{descriere}" style="line-height:1.6; color:#555; margin-bottom:20px;"></p>

            <div class="price-tag" th:text="*{pret} + ' lei'"
                 style="font-size:28px; color:#d63384; font-weight:bold; margin-bottom:25px;"></div>

            <form th:action="@{/cart/add}" method="post" style="display:flex; gap:10px; align-items:center;">
                <input type="hidden" name="buchetId" th:value="*{id}">

                <label>Cantitate:</label>
                <input type="number" name="quantity" value="1" min="1"
                       style="width: 60px; padding: 10px; border-radius:5px; border:1px solid #ccc;">

                <button type="submit" class="add-to-cart-btn"
                        style="background-color:#800020; color:white; padding:12px 25px; border:none; border-radius:25px; font-size:16px; cursor:pointer;">
                    Adaugă în Coș
                </button>
            </form>
        </div>
    </div>
</div>

<footer>
    <div class="footer-content">
        <h1>Contactează-ne</h1>
        <p>Adresa: Str. Tineretului 10, Chișinău, Moldova</p>
        <p>Telefon: +373 22 123 456</p>
        <p>Email: GrowFlowers@gmail.com</p>
        <div class="social-icons">
            <a href="#"><img th:src="@{/icons/facebook.png}" alt="Facebook"></a>
            <a href="#"><img th:src="@{/icons/twiter.png}" alt="Twitter"></a>
            <a href="#"><img th:src="@{/icons/insta.png}" alt="Instagram"></a>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
