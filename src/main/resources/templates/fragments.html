<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="headData">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="header">
    <div class="logo-area">
        <span class="menu-icon" onclick="toggleMenu()">☰</span>
        <img th:src="@{/icons/logo.png}" class="logo" onclick="gotoHome()" alt="Logo" style="cursor:pointer;">
    </div>

    <nav class="main-menu" id="menu">
        <ul>
            <li><a th:href="@{/}">Acasă</a></li>
            <li><a th:href="@{/buchete}">Buchete</a></li>
            <li><a th:href="@{/profile}">Profil</a></li>
            <li><a th:href="@{/contact}">Contact</a></li>
        </ul>
    </nav>

    <div class="user-area">
        <form action="/buchete" method="get" class="header-search" style="display:inline-flex; gap:6px; align-items:center;">
            <input type="text" name="q" placeholder="Caută..." style="padding:6px 8px; border-radius:6px; border:1px solid #ccc;">
            <button type="submit" style="padding:6px 10px; border:none; background:#800020; color:#fff; border-radius:6px; cursor:pointer;">Caută</button>
        </form>
        <img th:src="@{/icons/acount.png}" alt="Cont" onclick="gotoLogin()" class="nav-icon" style="cursor:pointer;">
        <div class="cart-icon-wrap" style="position:relative;">
            <svg class="nav-icon cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Coș" style="cursor:pointer;" onclick="gotoCart()">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span id="cart-badge" class="cart-badge" th:text="${cartItemCount}?:0"
                  style="position:absolute; top:-6px; right:-8px; background:#d63384; color:white; font-size:12px; border-radius:10px; padding:1px 6px; cursor:pointer;"
                  onclick="gotoCart()">0</span>
        </div>
    </div>
</header>

</body>
</html>
