<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<div class="content container">
    <h1 style="text-align:center; margin-top:20px;">Catalogul Nostru</h1>

    <div style="text-align:center; margin-bottom:20px;">
        <form action="/buchete" method="get">
            <input type="text" name="q" placeholder="Caută buchet..." style="padding:8px; width:200px;">
            <button type="submit" style="padding:8px;">Caută</button>
        </form>
    </div>

    <div class="bouquets-container" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px;">
        <div th:each="buchet : ${listaBuchete}" class="bouquet-card" style="border:1px solid #ddd; padding:10px; width:220px;">
            <a th:href="@{/buchete/detalii/{id}(id=${buchet.id})}" style="text-decoration:none; color:inherit;">
                <img th:src="${buchet.imageUrl != null} ? ${buchet.imageUrl} : @{/icons/logo.png}"
                     style="width:100%; height:200px; object-fit:cover;">
                <h4 th:text="${buchet.denumireBuchet}" style="margin:10px 0;"></h4>
                <p th:text="${buchet.pret} + ' lei'" style="font-weight:bold; color:#800020;"></p>
                <button style="width:100%; padding:5px; background:#800020; color:white; border:none;">Vezi Detalii</button>
            </a>
        </div>
    </div>
</div>

<footer>
    <div class="footer-content">
        <h1>Contactează-ne</h1>
        <p>Adresa: Str. Tineretului 10, Chișinău, Moldova</p>
        <p>Telefon: +373 22 123 456</p>
        <p>Email: GrowFlowers@gmail.com</p>
        <div class="social-icons">
            <a href="#"><img th:src="@{/icons/facebook.png}" alt="Facebook"></a>
            <a href="#"><img th:src="@{/icons/twiter.png}" alt="Twitter"></a>
            <a href="#"><img th:src="@{/icons/insta.png}" alt="Instagram"></a>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
