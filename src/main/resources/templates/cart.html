<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coșul Meu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: var(--color-secondary, #800020); }
        .checkout-btn {
            display: inline-block;
            background-color: #28a745; /* Verde pentru checkout */
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            float: right;
        }
    </style>
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<div class="content container">
    <h2>Coșul de cumpărături</h2>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p>Coșul tău este gol. <a th:href="@{/buchete}">Mergi la cumpărături!</a></p>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}">
        <table>
            <thead>
            <tr>
                <th>Produs</th>
                <th>Preț</th>
                <th>Cantitate</th>
                <th>Total</th>
                <th>Acțiuni</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.buchet.denumireBuchet}">Trandafiri</td>
                <td th:text="${item.buchet.pret} + ' lei'">100 lei</td>
                <td th:text="${item.quantity}">1</td>
                <td th:text="${item.quantity * item.buchet.pret} + ' lei'">100 lei</td>
                <td>
                    <a th:href="@{/cart/remove/{id}(id=${item.buchet.id})}" style="color: red;">Șterge</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div style="text-align: right; margin-top: 20px;">
            <h3>Total General: <span th:text="${totalCartPrice}">0</span> lei</h3>
            <a th:href="@{/cart/checkout}" class="checkout-btn">Finalizează Comanda</a>
        </div>
    </div>
</div>

<footer>
    <div class="footer-content">
        <h1>Contactează-ne</h1>
        <p>Adresa: Str. Tineretului 10, Chișinău, Moldova</p>
        <p>Telefon: +373 22 123 456</p>
        <p>Email: GrowFlowers@gmail.com</p>
        <div class="social-icons">
            <a href="#"><img th:src="@{/icons/facebook.png}" alt="Facebook"></a>
            <a href="#"><img th:src="@{/icons/twiter.png}" alt="Twitter"></a>
            <a href="#"><img th:src="@{/icons/insta.png}" alt="Instagram"></a>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
