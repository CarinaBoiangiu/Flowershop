<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Flower</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* Stilurile tale CSS */
        .register-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            padding: 40px 20px;
        }

        .register-box {
            background-color: white;
            border: 2px solid var(--color-secondary, #800020);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .register-box h2 {
            color: var(--color-secondary, #800020);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-dark, #333);
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .register-btn {
            background-color: var(--color-secondary, #800020);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .error-message {
            color: red;
            background-color: #ffe6e6;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<header th:replace="~{fragments :: header}"></header>

<div class="content">
    <div class="register-section">
        <div class="register-box">
            <h2>Înregistrează-te</h2>

            <div th:if="${error}" class="error-message">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post">

                <div class="form-group">
                    <label for="username">Nume de utilizator</label>
                    <input type="text" id="username" th:field="*{username}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>

                <div class="form-group">
                    <label for="password">Parola</label>
                    <input type="password" id="password" th:field="*{password}" required>
                </div>

                <button type="submit" class="register-btn">Înregistrează-te</button>
            </form>

            <p style="margin-top: 15px; font-size: 0.9em;">
                Ai deja cont? <a th:href="@{/login}" style="color: var(--color-secondary, #800020);">Loghează-te</a>
            </p>
        </div>
    </div>
</div>

<footer>
    <div class="footer-content">
        <h1>Contactează-ne</h1>
        <p>Adresa: Str. Tineretului 10, Chișinău, Moldova</p>
        <p>Email: GrowFlowers@gmail.com</p>
        <div class="social-icons">
            <a href="#"><img th:src="@{/icons/facebook.png}" alt="Facebook"></a>
            <a href="#"><img th:src="@{/icons/twiter.png}" alt="Twitter"></a>
            <a href="#"><img th:src="@{/icons/insta.png}" alt="Instagram"></a>
        </div>
    </div>
</footer>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
